name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  compile:
    name: Compile (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: windows-x86_64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          find hello -type f -name '*.sh' -exec chmod +x {} +

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/install.sh

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\install.bat

      - name: Compile languages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/compile.sh

      - name: Compile languages (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\compile.bat

      - name: Verify release artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d dist ]]; then
            echo "ERROR: dist/ does not exist."
            exit 1
          fi

          find dist -maxdepth 1 -type f -print

          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No release artifacts were produced."
            exit 1
          fi

          if find dist -mindepth 2 -print -quit | grep -q .; then
            echo "ERROR: Unexpected nested files in dist/."
            exit 1
          fi

          invalid=0

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"

            if [[ ! "$name" =~ ^hello-.+-(x86_64|arm64)-Linux(\.[A-Za-z0-9._+-]+)?$ ]]; then
              echo "ERROR: Invalid release filename: $name"
              invalid=1
            fi
          done < <(find dist -maxdepth 1 -type f -print0)

          if [[ "$invalid" -ne 0 ]]; then
            exit 1
          fi

      - name: Verify release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'dist' -PathType Container)) {
            throw 'ERROR: dist/ does not exist.'
          }

          $files = @(Get-ChildItem 'dist' -File)

          if ($files.Count -eq 0) {
            throw 'ERROR: No release artifacts were produced.'
          }

          $files | ForEach-Object { Write-Host $_.Name }

          $invalid = @($files | Where-Object {
            $_.Name -notmatch '^hello-.+-(x86_64|arm64)-Windows(\.[A-Za-z0-9._+-]+)?$'
          })

          if ($invalid.Count -gt 0) {
            throw "ERROR: Invalid release filenames: $($invalid.Name -join ', ')"
          }

          $nested = @(Get-ChildItem 'dist' -Recurse -File |
            Where-Object { $_.DirectoryName -ne (Resolve-Path 'dist').Path })

          if ($nested.Count -gt 0) {
            throw 'ERROR: Unexpected nested files in dist/.'
          }

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: compile
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify combined release files
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d dist ]]; then
            echo "ERROR: No downloaded artifacts."
            exit 1
          fi

          count="$(find dist -maxdepth 1 -type f | wc -l)"

          if [[ "$count" -eq 0 ]]; then
            echo "ERROR: No files available for release."
            exit 1
          fi

          echo "Files prepared for release:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true